[package]
name = "miju-services"
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nanfeng-labs/miju-services"
description = "Application assembly, service lifecycles, owned work, and resource cleanup for miju"
include = ["src/**/*.rs", "examples/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "README.zh-CN.md", "LICENSE", "CHANGELOG.md"]

[features]
default = []
## Emit lifecycle warnings without installing a subscriber.
tracing = ["dep:tracing"]
## Generate the feature reference in documentation.
docsrs = ["dep:document-features"]

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, optional = true }
document-features = { version = "0.2.12", optional = true }


[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util", "signal"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
await_holding_lock = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
normal = ["document-features"]
