[package]
name = "miju-services"
version = "0.2.0-beta.6"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nanfeng-labs/miju-services"
description = "Application assembly, service lifecycles, owned work, and resource cleanup for miju"
include = ["src/**/*.rs", "examples/**/*.rs", "examples/jni/Cargo.toml.in", "examples/jni/Cargo.lock", "examples/jni/README.md", "examples/jni/run.py", "examples/jni/java/**/*.java", "examples/configured_app/README.md", "examples/configured_app/settings.toml", "tests/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "README.zh-CN.md", "LICENSE", "CHANGELOG.md", "assets/**"]

[features]
default = ["miju", "periodic"]
## Attach miju Workers and Monitors without replacing their execution policy.
miju = ["dep:miju", "dep:futures-util"]
## Run serial periodic operations as service-owned work.
periodic = []
## Host one application generation at a time behind the five-method Java ABI.
jni = ["dep:jni", "tokio/rt-multi-thread", "tokio/net"]
## Emit lifecycle warnings without installing a subscriber.
tracing = ["dep:tracing"]
## Generate the feature reference in documentation.
docsrs = ["dep:document-features"]

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, optional = true }
document-features = { version = "0.2.12", optional = true }
miju = { version = "0.2.1", default-features = false, optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std"], optional = true }

jni = { version = "0.22.4", default-features = false, optional = true }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "ws"] }
http-body = "1.0.1"
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
miju = { version = "0.2.1", default-features = false, features = ["retry"] }
miju-cron = { version = "0.2.0", default-features = false, features = ["cron"] }
cron = "0.17.0"
tower = { version = "0.5.3", default-features = false, features = ["limit", "util"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
config = { version = "0.15.27", default-features = false, features = ["toml"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util", "signal", "fs", "io-util", "net"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
await_holding_lock = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
normal = ["document-features"]

[[example]]
name = "miju_worker"
required-features = ["miju"]

[[example]]
name = "miju_monitor"
required-features = ["miju"]

[[example]]
name = "periodic"
required-features = ["periodic"]

[[example]]
name = "cron_worker"
required-features = ["miju"]

[[example]]
name = "bounded_queue_rounds"
required-features = ["miju"]
