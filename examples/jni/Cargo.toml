[package]
name = "miju-jni-udp"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
miju-services = { path = "../..", default-features = false, features = ["jni"] }
tokio = { version = "1.53.3", features = ["sync", "net"] }

[lints.rust]
unsafe_code = "deny"
